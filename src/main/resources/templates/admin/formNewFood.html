<!DOCTYPE html>
<html>

<head>
	<title th:text="'Ukihashi Ramen - ' + ${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Piatto'"></title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
</head>

<body>
	<header th:replace="~{fragments/header}"></header>

		<div class="main-container">
		
			<h1 th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Piatto'"></h1>

		
			<form class="form" 
				  th:action="@{${action == 'create' ? '/admin/submitFood' : '/admin/submitFood' + (food.id != null ? '/'+food.id : '')}}"
			      method="POST" th:object="${food}">
				  
				<div class="input-group">
			    	<label>Nome:</label>
			    	<input type="text" id="name" th:field="*{name}" maxlength="254" required ><br><br>
								
			    	<label>Descrizione:</label>
			    	<textarea type="text" id="descrizione" th:field="*{descrizione}" maxlength="254" required ></textarea> <br><br>
				
					<label>Prezzo:</label>
					<input type="number" id="prezzo" th:field="*{prezzo}" step="0.01" min="0" required><br><br>
				
				
			    	<input type="hidden" id="urlOfPicture" th:field="*{urlOfPicture}">
				</div>

			    <button type="submit">
			        <span th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' Piatto'"></span>
			    </button>
				
				<br>
				<br>
				
				<span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
				<span class="error" th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}"></span>

			</form>
			<br>
							
	
			
		</div>	  
		<footer th:replace="~{fragments/footer} "></footer>
 
</body>
</html>
