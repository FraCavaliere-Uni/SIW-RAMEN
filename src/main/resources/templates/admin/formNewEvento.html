<!DOCTYPE html>
<html>

<head>
	<title th:text="'Ukihashi Ramen - ' + ${action == 'create' ? 'Crea' : 'Aggiorna'} + ' evento'">
		
	</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
</head>

<body>
	<header th:replace="~{fragments/header}"></header>

	
	<div class="main-container">
		<h1 class="main-title" th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' evento'"></h1>


	
		<form class="form" th:action="@{${action == 'create' ? '/admin/submitEvento' : '/admin/submitEvento/' + evento.id}}" 
		      method="POST" th:object="${evento}">

			<div class="input-group">
			    <label>Titolo:</label>
			    <input type="text" id="title" th:field="*{title}" required><br><br>
			    
			    <label>Data:</label>
			    <input type="date" id="date" th:field="*{date}" th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" required><br><br>
	
			    <input type="hidden" id="urlImage" th:field="*{urlImage}">
	
			    <label>Descrizione:</label>
			    <textarea id="descrizione" rows="10" cols="50" style="resize: none; max-width: 100%; white-space: pre-wrap;" th:field="*{descrizione}"></textarea><br><br>
	
				<input type="hidden" name="sala.id" th:value="*{sala?.id} != null ? *{sala.id} : null" />
				
			    <button type="submit">
			        <span th:text="${action == 'create' ? 'Crea' : 'Aggiorna'} + ' evento'"></span>
			    </button>
				
				<span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

			</div>
		</form>
		<br>
	</div>
	
	<footer th:replace="~{fragments/footer} "></footer>


</body>

</html>
