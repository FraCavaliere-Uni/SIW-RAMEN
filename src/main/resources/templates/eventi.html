<!DOCTYPE html>
<html>

<head>
	<title>Ukihashi Ramen - Eventi</title>
	<link rel="stylesheet" href="/css/stile.css" />
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">

</head>

<body>
	<header th:replace="~{fragments/header}"></header>

			
	<div class="main-container">

		<h1 class="main-title">Eventi programmati</h1>
		<a class="fake-button" href="/formSearchEventi"><i class="fa-solid fa-magnifying-glass"></i> Cerca eventi</a>
		<br>
		<br>
		
		<div th:if="${eventi==null || eventi.isEmpty()}">Non ci sono eventi programmati</div>
	
		<ul class="list">
			<a th:each="evento : ${eventi}"th:href="@{'/evento' + '/' + ${evento.id}}">
				<li th:text="${evento.title}"></li></a>
		</ul>
		
		<br>
	</div>
	<footer th:replace="~{fragments/footer} "></footer>

</body>

</html>
